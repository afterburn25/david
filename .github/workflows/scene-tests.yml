name: DAVID 3D asset validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'build_gallery_v03.py'
      - 'optimize_gallery_v03.py'
      - 'tests_v03.py'
      - 'assets/rooms/**'
      - '.github/workflows/scene-tests.yml'
  pull_request:
    paths:
      - 'build_gallery_v03.py'
      - 'optimize_gallery_v03.py'
      - 'tests_v03.py'
      - 'assets/rooms/**'

permissions:
  contents: read

jobs:
  verify-3d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python and PHP
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install mesh tooling
        run: python -m pip install 'trimesh>=4.10,<5' numpy pillow shapely scipy
      - name: Check that complete scene source is present
        run: |
          test -f build_gallery_v03.py || { echo 'Missing build_gallery_v03.py — source archive not committed'; exit 1; }
          test -f optimize_gallery_v03.py || { echo 'Missing optimize_gallery_v03.py'; exit 1; }
          test -f tests_v03.py || { echo 'Missing tests_v03.py'; exit 1; }
          test -f deploy/showroom-glb.php || { echo 'Missing PHP showroom route'; exit 1; }
      - name: Generate GLB from source
        run: |
          python build_gallery_v03.py
          python optimize_gallery_v03.py
      - name: Test mesh and PHP/JS integration
        run: |
          php -l deploy/showroom-glb.php
          python tests_v03.py
      - name: Produce validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: david-v03-verified-scene
          path: assets/rooms/luxury-showroom-v03-optimized.glb
          retention-days: 14
